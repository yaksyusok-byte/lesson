/* Cinematic title: centered composition, motion 6/10, density 4/10.
   Native Canvas/CSS; an embedded Cyrillic serif, not the Latin Matrix logo font. */
:root{color-scheme:dark;background:#000402;color:#caffca}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#000402}
canvas,.veil{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.veil{background:radial-gradient(ellipse 53% 34% at 50% 50%,rgba(0,4,1,.88) 0%,rgba(0,4,1,.66) 43%,transparent 100%),radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%)}
main{position:relative;min-height:100%;min-height:100dvh;display:grid;place-items:center;padding:24px}
h1{margin:0;width:100%;text-align:center;font-family:MatrixSerif,'Times New Roman',serif;font-weight:400;line-height:1.1;text-transform:uppercase;letter-spacing:.055em;color:#caffc6;text-shadow:0 0 3px #83ff7b,0 0 15px #26e24788,0 0 45px #13d42c40;user-select:text}
.line{display:block;white-space:nowrap;font-size:clamp(24px,7.6vw,112px)}
.line:first-child{font-size:clamp(52px,9.3vw,138px);letter-spacing:.19em;padding-left:.19em;margin-bottom:.12em}
.glyph{display:inline-block;position:relative}
.glyph.scrambling{color:#47d564;text-shadow:0 0 10px #10e34466}
/* Fine static incisions recall the reference without damaging letter shapes. */
.line{mask-image:linear-gradient(to bottom,#000 0%,#000 44%,#0009 44.4%,#000 44.9%,#000 100%)}
@media(max-width:600px){main{padding:14px}.line{font-size:7.55vw;letter-spacing:.025em}.line:first-child{font-size:15vw;margin-bottom:.28em}.veil{background:radial-gradient(ellipse 75% 26% at 50% 50%,#000402ed,transparent)}}
@media(max-height:420px) and (min-width:601px){.line{font-size:10vh}.line:first-child{font-size:15vh}}
@media(prefers-reduced-motion:reduce){.glyph{opacity:1!important}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<main><h1 aria-label="Имя существительное"><span class="line">Имя</span> <span class="line">существительное</span></h1></main>
<script>
'use strict';
(()=>{
const canvas=document.getElementById('rain'), ctx=canvas.getContext('2d',{alpha:false});
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const alphabet='012345678901001101<>/{}[]=+*:ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const rand=(a,b)=>a+Math.random()*(b-a);
const symbol=()=>alphabet[Math.floor(Math.random()*alphabet.length)];
let width=0,height=0,streams=[],frame=0,last=0,elapsed=0,mutation=0;
const letters=[];
document.querySelectorAll('.line').forEach(line=>{
 const text=line.textContent;line.textContent='';line.setAttribute('aria-hidden','true');
 for(const char of text){const span=document.createElement('span');span.className='glyph';span.textContent=char;line.append(span);letters.push({span,char,settle:rand(.42,1.75)});}
});
function title(t){
 for(const item of letters){
  const settled=motion.matches||t>=item.settle;
  item.span.textContent=settled?item.char:symbol();
  item.span.classList.toggle('scrambling',!settled);
  item.span.style.opacity=settled?'1':String(Math.min(1,.15+t*.65));
 }
}
function size(){
 width=innerWidth;height=innerHeight;
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
 // Stable glyph boxes prevent scramble-induced title movement.
 for(const item of letters){item.span.style.width='';item.span.textContent=item.char;}
 for(const item of letters){item.span.style.width=item.span.getBoundingClientRect().width+'px';}
 streams=[];
 const layers=[{size:10,spacing:19,speed:22,alpha:.22},{size:14,spacing:30,speed:48,alpha:.50},{size:18,spacing:49,speed:80,alpha:.83}];
 for(const [depth,layer] of layers.entries()){
  for(let x=rand(0,layer.spacing);x<width;x+=layer.spacing*rand(.8,1.6)){
   if(Math.random()<.18)continue;
   const count=Math.floor(rand(9,38));
   streams.push({x:x+rand(-3,3),y:rand(-height*.5,height*1.2),size:layer.size,speed:layer.speed*rand(.65,1.5),alpha:layer.alpha*rand(.55,1),count,chars:Array.from({length:count},symbol),depth});
  }
 }
 draw(0);if(motion.matches)title(2);
}
function draw(dt){
 ctx.fillStyle='#000402';ctx.fillRect(0,0,width,height);
 for(const s of streams){
  s.y+=s.speed*dt;
  if(s.y-s.count*s.size>height){s.y=-rand(20,height*.65);s.speed*=rand(.94,1.06);}
  ctx.font=s.size+'px monospace';
  for(let i=s.count-1;i>=0;i--){
   const y=s.y-i*s.size*1.18;if(y<0||y>height+s.size)continue;
   const fade=Math.pow(1-i/s.count,1.6),head=i===0;
   ctx.globalAlpha=s.alpha*(head?1:fade*.85);
   ctx.fillStyle=head?(s.depth===2?'#aaffbd':'#53e47a'):'#18b548';
   ctx.fillText(s.chars[i],s.x,y);
  }
 }
 ctx.globalAlpha=1;
}
function tick(now){
 frame=0;if(document.hidden||motion.matches)return;
 const dt=last?Math.min((now-last)/1000,.05):0;last=now;elapsed+=dt;mutation+=dt;
 if(mutation>.085){
  for(const s of streams){s.chars[Math.floor(rand(0,s.count))]=symbol();if(Math.random()<.3)s.chars[0]=symbol();}
  if(elapsed<1.9)title(elapsed);mutation=0;
 }
 if(elapsed>=1.9&&elapsed-dt<1.9)title(2);
 draw(dt);frame=requestAnimationFrame(tick);
}
function resume(){
 cancelAnimationFrame(frame);frame=0;last=0;
 if(motion.matches){title(2);draw(0);return;}
 if(!document.hidden)frame=requestAnimationFrame(tick);
}
addEventListener('resize',size);
document.addEventListener('visibilitychange',resume);
motion.addEventListener('change',resume);
// Font is embedded. Initialize after decoding, also works directly via file://.
document.fonts.ready.then(()=>{size();title(motion.matches?2:0);resume();});
})();
</script>
</body>
